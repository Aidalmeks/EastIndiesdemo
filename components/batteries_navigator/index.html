<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; color: #cbd5e1; font: 13px system-ui, sans-serif; }
  #root { padding: 2px 0; }
  canvas { display: block; width: 100%; height: 165px; cursor: crosshair; }
  #controls { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  button { border: 1px solid #2563eb; border-radius: 5px; background: #1d4ed8; color: white; padding: 5px 11px; cursor: pointer; }
  button.secondary { background: transparent; color: #93c5fd; }
  #label { color: #94a3b8; }
</style>
</head>
<body>
<div id="root">
  <canvas id="chart"></canvas>
  <div id="controls"><button id="apply">应用区间</button><button id="reset" class="secondary">恢复当前区间</button><span id="label"></span></div>
</div>
<script>
const canvas = document.getElementById("chart"), ctx = canvas.getContext("2d");
const apply = document.getElementById("apply"), reset = document.getElementById("reset"), label = document.getElementById("label");
let args = null, start = 0, end = 1, initialStart = 0, initialEnd = 1, drag = null;
const pad = {left: 8, right: 8, top: 12, bottom: 14};
function post(type, extra={}) { window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*"); }
function ready() { post("streamlit:componentReady", {apiVersion: 1}); post("streamlit:setFrameHeight", {height: 202}); }
function px(index) { return pad.left + (index / Math.max(1, args.total_bars - 1)) * (canvas.width / devicePixelRatio - pad.left - pad.right); }
function indexAt(x) {
  const usable = canvas.width / devicePixelRatio - pad.left - pad.right;
  return Math.max(0, Math.min(args.total_bars - 1, Math.round((x - pad.left) / usable * (args.total_bars - 1))));
}
function timeAt(index) {
  if (!args || !args.time_labels || !args.time_labels.length) return "";
  return args.time_labels[Math.max(0, Math.min(args.time_labels.length - 1, Math.round(index)))];
}
function draw() {
  if (!args) return;
  const cssWidth = canvas.clientWidth || 800, cssHeight = 165, ratio = devicePixelRatio || 1;
  canvas.width = cssWidth * ratio; canvas.height = cssHeight * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0); ctx.clearRect(0, 0, cssWidth, cssHeight);
  const finite = args.values.filter(Number.isFinite);
  const lo = Math.min(...finite), hi = Math.max(...finite), span = Math.max(hi - lo, 1e-12);
  const y = value => pad.top + (hi - value) / span * (cssHeight - pad.top - pad.bottom);
  ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1; ctx.beginPath();
  args.values.forEach((value, i) => {
    if (!Number.isFinite(value)) return;
    const x = px(args.indices[i]), yy = y(value);
    if (i === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  });
  ctx.stroke();
  const left = px(start), right = px(end);
  ctx.fillStyle = "rgba(29,78,216,0.12)"; ctx.fillRect(left, pad.top, right-left, cssHeight-pad.top-pad.bottom);
  ctx.strokeStyle = "#1d4ed8"; ctx.lineWidth = 2.5; ctx.strokeRect(left, pad.top, right-left, cssHeight-pad.top-pad.bottom);
  ctx.fillStyle = "#2563eb"; ctx.fillRect(left - 2, pad.top, 4, cssHeight-pad.top-pad.bottom); ctx.fillRect(right - 2, pad.top, 4, cssHeight-pad.top-pad.bottom);
  label.textContent = "北京时间 " + timeAt(start) + " 至 " + timeAt(end);
}
function pointerX(event) { const rect = canvas.getBoundingClientRect(); return event.clientX - rect.left; }
canvas.addEventListener("pointerdown", event => {
  if (!args) return;
  const x = pointerX(event), left = px(start), right = px(end);
  drag = Math.abs(x-left) < 9 ? "left" : Math.abs(x-right) < 9 ? "right" : "new";
  if (drag === "new") { start = indexAt(x); end = start; }
  canvas.setPointerCapture(event.pointerId); draw();
});
canvas.addEventListener("pointermove", event => {
  if (!drag || !args) return;
  const value = indexAt(pointerX(event));
  if (drag === "left") start = Math.min(value, end - 1);
  else if (drag === "right") end = Math.max(value, start + 1);
  else end = value;
  if (start > end) [start, end] = [end, start];
  draw();
});
canvas.addEventListener("pointerup", event => { drag = null; canvas.releasePointerCapture(event.pointerId); draw(); });
apply.addEventListener("click", () => post("streamlit:setComponentValue", {value: {start_index: start, end_index: end}}));
reset.addEventListener("click", () => { start = initialStart; end = initialEnd; draw(); });
window.addEventListener("resize", draw);
window.addEventListener("message", event => {
  if (event.data.type !== "streamlit:render") return;
  args = event.data.args; initialStart = Number(args.start_index); initialEnd = Number(args.end_index);
  start = initialStart; end = initialEnd; draw();
});
ready();
</script>
</body>
</html>
