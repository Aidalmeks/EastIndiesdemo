<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./plotly.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
    }

    #chart {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const chartDiv = document.getElementById("chart");
    let currentEndIdx = null;
    let trainShapeIndex = 0;
    let splitShapeIndex = 1;
    let currentTrainStart = null;
    let currentSplitIdx = null;
    let activeDragTarget = null;
    let suppressRelayout = false;

    function sendMessage(type, payload = {}) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type }, payload),
        "*"
      );
    }

    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height });
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value });
    }

    function nearestInt(value) {
      return Math.round(Number(value) || 0);
    }

    function clamp(value, low, high) {
      return Math.max(low, Math.min(high, value));
    }

    function getShape(layout, index) {
      return layout?.shapes?.[index] || null;
    }

    function verticalShapeX(index) {
      const shape = getShape(chartDiv._fullLayout, index);
      return shape ? Number(shape.x0) : null;
    }

    function horizontalShapeY(index) {
      const shape = getShape(chartDiv._fullLayout, index);
      return shape ? Number(shape.y0) : null;
    }

    function updateCurrentShapeState() {
      currentTrainStart = verticalShapeX(trainShapeIndex);
      currentSplitIdx = verticalShapeX(splitShapeIndex);
    }

    function detectDragTarget(event) {
      const fullLayout = chartDiv._fullLayout;
      const xaxis = fullLayout?.xaxis;
      const yaxis = fullLayout?.yaxis;
      if (!xaxis || !yaxis) {
        return null;
      }

      const mouseX = event.offsetX;
      const mouseY = event.offsetY;
      const candidates = [];

      const trainX = verticalShapeX(trainShapeIndex);
      if (trainX !== null) {
        const trainPx = (xaxis._offset || 0) + xaxis.l2p(trainX);
        if (Math.abs(mouseX - trainPx) <= 8) {
          candidates.push({ target: "train", distance: Math.abs(mouseX - trainPx) });
        }
      }

      const splitX = verticalShapeX(splitShapeIndex);
      if (splitX !== null) {
        const splitPx = (xaxis._offset || 0) + xaxis.l2p(splitX);
        if (Math.abs(mouseX - splitPx) <= 8) {
          candidates.push({ target: "split", distance: Math.abs(mouseX - splitPx) });
        }
      }

      if (!candidates.length) {
        return null;
      }

      candidates.sort((a, b) => a.distance - b.distance);
      return candidates[0].target;
    }

    function updateCursor(event) {
      const target = activeDragTarget || detectDragTarget(event);
      if (!target) {
        chartDiv.style.cursor = "default";
        return;
      }

      if (activeDragTarget) {
        chartDiv.style.cursor = "grabbing";
        return;
      }

      chartDiv.style.cursor = "grab";
    }

    function attachCursorHandlers() {
      chartDiv.onmousemove = updateCursor;
      chartDiv.onmousedown = (event) => {
        activeDragTarget = detectDragTarget(event);
        updateCursor(event);
      };
      window.onmouseup = () => {
        activeDragTarget = null;
        chartDiv.style.cursor = "default";
      };
    }

    function normalizeTrainX(rawX) {
      return clamp(nearestInt(rawX), 0, Math.max(0, nearestInt(currentSplitIdx ?? currentEndIdx) - 10));
    }

    function normalizeSplitX(rawX) {
      return clamp(nearestInt(rawX), Math.max(0, nearestInt(currentTrainStart ?? 0) + 10), Math.max(0, currentEndIdx - 1));
    }

    function attachPlotlyHandlers() {
      if (chartDiv.__plotlyHandlersAttached) {
        return;
      }

      chartDiv.on("plotly_relayout", (eventData) => {
        if (suppressRelayout) {
          return;
        }

        const movedTrainX = eventData?.[`shapes[${trainShapeIndex}].x0`] ?? eventData?.[`shapes[${trainShapeIndex}].x1`];
        if (movedTrainX !== undefined && movedTrainX !== null) {
          const nextTrain = normalizeTrainX(movedTrainX);
          if (currentTrainStart !== null && nextTrain === nearestInt(currentTrainStart)) {
            return;
          }

          currentTrainStart = nextTrain;
          suppressRelayout = true;
          Plotly.relayout(chartDiv, {
            [`shapes[${trainShapeIndex}].x0`]: nextTrain,
            [`shapes[${trainShapeIndex}].x1`]: nextTrain,
          }).then(() => {
            suppressRelayout = false;
            updateCurrentShapeState();
          });
          setComponentValue({ train_start: nextTrain });
          return;
        }

        const movedSplitX = eventData?.[`shapes[${splitShapeIndex}].x0`] ?? eventData?.[`shapes[${splitShapeIndex}].x1`];
        if (movedSplitX !== undefined && movedSplitX !== null) {
          const nextSplit = normalizeSplitX(movedSplitX);
          if (currentSplitIdx !== null && nextSplit === nearestInt(currentSplitIdx)) {
            return;
          }

          currentSplitIdx = nextSplit;
          suppressRelayout = true;
          Plotly.relayout(chartDiv, {
            [`shapes[${splitShapeIndex}].x0`]: nextSplit,
            [`shapes[${splitShapeIndex}].x1`]: nextSplit,
          }).then(() => {
            suppressRelayout = false;
            updateCurrentShapeState();
          });
          setComponentValue({ split_idx: nextSplit });
          return;
        }

      });

      chartDiv.__plotlyHandlersAttached = true;
    }

    function renderChart(args) {
      const figure = args.figure || {};
      const data = figure.data || [];
      const layout = Object.assign({}, figure.layout || {});
      const requestedHeight = Number(args.height || 560);
      currentEndIdx = Number(args.end_idx ?? 0);
      trainShapeIndex = Number(args.train_shape_index ?? 0);
      splitShapeIndex = Number(args.split_shape_index ?? 1);

      layout.height = requestedHeight;
      layout.autosize = true;
      layout.dragmode = "zoom";
      layout.shapes = (layout.shapes || []).map((shape, index) => {
        const copy = Object.assign({}, shape);
        copy.editable = [trainShapeIndex, splitShapeIndex].includes(index);
        return copy;
      });

      const config = {
        responsive: true,
        displayModeBar: true,
        scrollZoom: true,
        editable: true,
        modeBarButtonsToRemove: ["lasso2d", "select2d"],
        edits: {
          shapePosition: true,
        },
      };

      Plotly.react(chartDiv, data, layout, config).then(() => {
        updateCurrentShapeState();
        attachPlotlyHandlers();
        attachCursorHandlers();
        setFrameHeight(requestedHeight);
      });
    }

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (!message || message.type !== "streamlit:render") {
        return;
      }

      renderChart(message.args || {});
    });

    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight(560);
  </script>
</body>
</html>
